<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none" role="img" aria-label="Royal Horizon — الأفق الملكي">
  <title>Royal Horizon — Stacked Lockup</title>
  <desc>Vertical stacked lockup with the primary monogram above bilingual wordmark and tagline.</desc>
  <style>
    .rh-word-ar { font-family: 'Tajawal', system-ui, sans-serif; font-size: 26px; font-weight: 700; fill: currentColor; }
    .rh-word-en { font-family: 'DM Sans', system-ui, sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 4px; fill: currentColor; opacity: 0.8; }
    .rh-tag-ar { font-family: 'Tajawal', system-ui, sans-serif; font-size: 12px; font-weight: 400; fill: currentColor; opacity: 0.7; }
    .rh-tag-en { font-family: 'DM Sans', system-ui, sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 2.5px; fill: currentColor; opacity: 0.55; }
  </style>

  <!-- الشعار الرئيسي -->
  <g transform="translate(60, 20)">
    <path d="M100 24 l2.4 7 l7 2.4 l-7 2.4 l-2.4 7 l-2.4 -7 l-7 -2.4 l7 -2.4 z" fill="currentColor"/>
    <rect x="46" y="56" width="12" height="108" rx="2" fill="currentColor"/>
    <rect x="142" y="56" width="12" height="108" rx="2" fill="currentColor"/>
    <circle cx="100" cy="102" r="11" fill="currentColor"/>
    <path d="M28 124 Q100 112 172 124" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- النصوص أسفل الشعار -->
  <text x="160" y="240" text-anchor="middle" class="rh-word-ar">الأفق الملكي</text>
  <text x="160" y="262" text-anchor="middle" class="rh-word-en">ROYAL HORIZON</text>

  <!-- فاصل صغير -->
  <line x1="140" y1="278" x2="180" y2="278" stroke="currentColor" stroke-width="0.5" opacity="0.4"/>

  <!-- الشعار الفرعي -->
  <text x="160" y="295" text-anchor="middle" class="rh-tag-ar">للسفر والسياحة</text>
  <text x="160" y="310" text-anchor="middle" class="rh-tag-en">TRAVEL &amp; TOURISM</text>
</svg>
