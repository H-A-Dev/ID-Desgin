<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="Royal Horizon">
  <title>Royal Horizon — Primary Monogram</title>
  <desc>The H of Horizon split by a rising sun and a curved horizon line, crowned with a royal four-point star. All shapes use currentColor for easy recoloring via CSS.</desc>
  <!-- النجمة الملكية فوق -->
  <path d="M100 24 l2.4 7 l7 2.4 l-7 2.4 l-2.4 7 l-2.4 -7 l-7 -2.4 l7 -2.4 z" fill="currentColor"/>
  <!-- أعمدة الـ H -->
  <rect x="46" y="56" width="12" height="108" rx="2" fill="currentColor"/>
  <rect x="142" y="56" width="12" height="108" rx="2" fill="currentColor"/>
  <!-- الشمس الصاعدة -->
  <circle cx="100" cy="102" r="11" fill="currentColor"/>
  <!-- خط الأفق -->
  <path d="M28 124 Q100 112 172 124" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
</svg>
