<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none" role="img" aria-label="Royal Horizon — الأفق الملكي">
  <title>Royal Horizon — Horizontal Lockup</title>
  <desc>Horizontal brand lockup combining the icon mark with bilingual wordmark: Arabic on top, Latin caps below.</desc>
  <style>
    .rh-word-ar { font-family: 'Tajawal', system-ui, sans-serif; font-size: 28px; font-weight: 700; fill: currentColor; }
    .rh-word-en { font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; font-weight: 500; letter-spacing: 4px; fill: currentColor; opacity: 0.78; }
  </style>

  <!-- أيقونة الشعار -->
  <g transform="translate(20, 36)">
    <path d="M8 44 Q32 35 56 44" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="32" cy="34" r="8" fill="currentColor"/>
  </g>

  <!-- فاصل عمودي -->
  <line x1="110" y1="40" x2="110" y2="80" stroke="currentColor" stroke-width="1" opacity="0.3"/>

  <!-- النص العربي -->
  <text x="130" y="58" class="rh-word-ar">الأفق الملكي</text>

  <!-- النص الإنجليزي -->
  <text x="130" y="84" class="rh-word-en">ROYAL HORIZON</text>
</svg>
